[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Benchmarking-ML-Models"
version = "0.0.1"
description = "A small package to benchmark machine learning models on a given dataset."
authors = [
    { name = "Marcus Gelderman", email = "marcgeld@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "matplotlib",
    "seaborn"]

[project.scripts]
bench = "benchtest.cli:main"

[tool.setuptools.packages.find]
include = ["benchtest*"]

